<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Playwright Tools E2E Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding-bottom: 2000px;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
        }
        #tall-box {
            height: 2500px;
            background: linear-gradient(to bottom, #f0f0f0, #a0c0f0);
            margin-top: 30px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>欢迎来到 Playwright Tools 端到端集成测试页面</h1>
    <p>这是一个专门用于自动化验证 Playwright 网页工具各功能特性的本地测试页面。</p>

    <div class="section">
        <h2>表单与交互测试</h2>
        <label for="test-input">用户名：</label>
        <input type="text" id="test-input" name="username" placeholder="请输入内容">

        <label for="test-select">选择模式：</label>
        <select id="test-select" name="choice">
            <option value="opt1">选项一</option>
            <option value="opt2">选项二</option>
        </select>

        <button id="test-btn" onclick="document.getElementById('result').innerText='clicked'">点击测试</button>
        <div id="result">初始状态</div>
    </div>

    <div class="section">
        <h2>原生弹窗测试</h2>
        <button id="btn-alert" onclick="alert('测试弹窗内容')">触发Alert</button>
    </div>

    <div class="section">
        <h2>多标签页测试</h2>
        <a id="link-new-tab" href="/newtab.html" target="_blank">打开新标签页</a>
    </div>

    <div id="tall-box">
        <h3>长内容与滚动测试区域</h3>
        <p>页面底部延伸区域，用于测试页面纵向滚动以及整页截图。</p>
        <div style="margin-top: 2200px;">
            <p id="bottom-text">这是长页面底部内容</p>
        </div>
    </div>
</body>
</html>
